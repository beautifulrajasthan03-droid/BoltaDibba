name: Build Flutter App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - run: flutter create . --org com.bolta.dibba --project-name bolta_dibba --platforms android

      - name: Update minSdk in build.gradle
        run: |
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' $BUILD_FILE
            sed -i 's/flutter.minSdkVersion/21/g' $BUILD_FILE
          fi

      - run: flutter pub get
      - run: flutter build apk --release
      
